name: Finalize README Visual

on:
  push:
    branches: ['agent/final-visual-proof']
    paths:
      - '.github/workflows/finalize-readme-visual.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-visual-proof
      - name: Insert above-the-fold GIF and remove finalizer
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          if '<img src="docs/assets/screenshots/demo-walkthrough.gif"' not in text:
              needle = "- Use [Public Proof](docs/public-proof.md) for a 30-second / 3-minute / 15-minute review path.\n\nThe intended UX lifecycle is:"
              insert = "- Use [Public Proof](docs/public-proof.md) for a 30-second / 3-minute / 15-minute review path.\n\n<p align=\"center\">\n  <img src=\"docs/assets/screenshots/demo-walkthrough.gif\" alt=\"Angular AI Copilot happy path, failure, and recovery walkthrough\" width=\"960\" />\n</p>\n\n<p align=\"center\"><em>Real exact-branch capture: default workspace → happy-path flow → retrieval failure → rejected approval → stalled stream → retry with prior context. Mock-only and deterministic; no backend or provider execution is claimed.</em></p>\n\nThe intended UX lifecycle is:"
              if needle not in text: raise SystemExit('README insertion point missing')
              p.write_text(text.replace(needle, insert, 1))
          Path('.github/workflows/finalize-readme-visual.yml').unlink()
      - name: Commit README embed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Promote resilience walkthrough in README [skip ci]'
          git push origin HEAD:agent/final-visual-proof
