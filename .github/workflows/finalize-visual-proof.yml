name: Finalize Visual Proof

on:
  push:
    branches: ['agent/final-visual-proof']
    paths:
      - '.github/workflows/finalize-visual-proof.yml'

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-visual-proof
      - name: Download validated visual artifact
        run: gh run download 31301466490 -n angular-ai-copilot-starter-public-proof -D /tmp/proof
      - name: Install final GIF and embed it
        shell: python
        run: |
          from pathlib import Path
          import shutil

          candidates = list(Path('/tmp/proof').rglob('demo-walkthrough.gif'))
          if not candidates: raise SystemExit('Validated GIF missing from Actions artifact')
          target = Path('docs/assets/screenshots/demo-walkthrough.gif')
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(candidates[0], target)
          if target.stat().st_size >= 8_000_000: raise SystemExit('GIF exceeds 8 MB')

          readme = Path('README.md')
          text = readme.read_text()
          needle = "- Use [Public Proof](docs/public-proof.md) for a 30-second / 3-minute / 15-minute review path.\n\nThe intended UX lifecycle is:"
          insert = "- Use [Public Proof](docs/public-proof.md) for a 30-second / 3-minute / 15-minute review path.\n\n<p align=\"center\">\n  <img src=\"docs/assets/screenshots/demo-walkthrough.gif\" alt=\"Angular AI Copilot happy path, failure, and recovery walkthrough\" width=\"960\" />\n</p>\n\n<p align=\"center\"><em>Real exact-branch capture: default workspace → happy-path flow → retrieval failure → rejected approval → stalled stream → retry with prior context. Mock-only and deterministic; no backend or provider execution is claimed.</em></p>\n\nThe intended UX lifecycle is:"
          if text.count('demo-walkthrough.gif') == 0:
              if needle not in text: raise SystemExit('README insertion point missing')
              readme.write_text(text.replace(needle, insert, 1))

          proof = Path('docs/public-proof.md')
          text = proof.read_text()
          needle = "## 30-second review\n\n1. Open the [live demo]"
          insert = "## 30-second review\n\n![Angular AI Copilot happy path, failure, and recovery walkthrough](assets/screenshots/demo-walkthrough.gif)\n\nThe animation is generated from the exact Angular branch build at a 1440×900 recruiter viewport. It pairs the primary deterministic flow with explicit failure and recovery states without implying a production backend.\n\n1. Open the [live demo]"
          if 'demo-walkthrough.gif' not in text:
              if needle not in text: raise SystemExit('Public-proof insertion point missing')
              proof.write_text(text.replace(needle, insert, 1))

          Path('.github/workflows/finalize-visual-proof.yml').unlink()
      - name: Commit final asset and embeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Embed final resilience visual proof [skip ci]'
          git push origin HEAD:agent/final-visual-proof
