name: Capture Public Proof

on:
  workflow_dispatch:
  pull_request:
    branches: ['master']

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Start exact branch demo locally
        shell: bash
        run: |
          npm start -- --host 127.0.0.1 --port 4202 > /tmp/angular-copilot.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4202/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/angular-copilot.log
          exit 1
      - name: Install isolated Playwright runtime
        run: |
          mkdir -p /tmp/public-proof-playwright
          cd /tmp/public-proof-playwright
          npm init -y
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Install GIF tooling
        run: sudo apt-get update && sudo apt-get install -y imagemagick gifsicle
      - name: Capture exact branch proof states
        env:
          NODE_PATH: /tmp/public-proof-playwright/node_modules
          CAPTURE_BASE_URL: http://127.0.0.1:4202/
          CAPTURE_OUTPUT_DIR: ${{ runner.temp }}/public-proof-captures
        run: node scripts/capture-public-proof.cjs
      - name: Rebuild and validate resilience walkthrough GIF
        shell: bash
        run: |
          set -euo pipefail
          captures='${{ runner.temp }}/public-proof-captures'
          rendered='${{ runner.temp }}/demo-walkthrough.gif'
          frames=()
          for name in copilot-default copilot-happy-path copilot-retrieval-failure copilot-approval-rejection copilot-stalled-stream copilot-recovery-retry; do
            if [[ -s "$captures/$name.png" ]]; then frames+=("$captures/$name.png"); fi
          done
          if (( ${#frames[@]} < 5 )); then cat "$captures/manifest.json" >&2; exit 1; fi
          convert -delay 120 -loop 0 "${frames[@]}" -resize '960x600>' -layers Optimize "$rendered"
          gifsicle -O3 --colors 128 "$rendered" -o "$rendered"
          test -s "$rendered"
          test "$(stat -c%s "$rendered")" -lt 8000000
          test -s docs/assets/screenshots/demo-walkthrough.gif
      - name: Upload proof captures
        uses: actions/upload-artifact@v4
        with:
          name: angular-ai-copilot-starter-public-proof
          path: |
            ${{ runner.temp }}/public-proof-captures
            ${{ runner.temp }}/demo-walkthrough.gif
          if-no-files-found: error
          retention-days: 30
